project_id = "bambini"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
# Mirrors src/server/auth/validation.ts's checkPasswordStrength() as a
# second, independent backstop enforced by Supabase Auth itself — the
# app's own check remains authoritative and runs first, this is
# defense in depth. Verified against the installed Supabase CLI
# (2.118.0)'s own generated config template: both keys and this exact
# value for password_requirements are real, supported options, not
# invented. Does NOT reach the already-deployed production project —
# see ENVIRONMENT.md's Production Supabase Auth configuration checklist
# for the equivalent Dashboard setting that must be made manually there.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
# Phase 5: local/dev now reflects intended production behaviour — email
# confirmation is required before account_verification-relevant state
# (auth.users.email_confirmed_at) can ever become true. signUp() (see
# src/server/auth/actions.ts) branches on whether a session actually
# came back, since a signup with confirmation pending returns no active
# session until the user clicks the confirmation link.
enable_confirmations = true

[auth.sms]
# Phase 15A.1 — phone verification foundation. NO SMS provider is
# configured here on purpose: no [auth.sms.twilio]/[auth.sms.vonage]/…
# block, no credentials, no provider chosen. Every key below was verified
# against Supabase CLI 2.118.0 (it parses this file without error).
#
# enable_signup stays false: with it true and no provider enabled the CLI
# prints "WARN: no SMS provider is enabled. Disabling phone login" and
# switches it off anyway. When a provider IS connected, set it true for
# local runs — it is the local "Phone provider" toggle that
# auth.updateUser({ phone }) needs (otherwise Auth answers
# phone_provider_disabled). See DEPLOYMENT.md "Connecting an SMS
# provider" for the hosted equivalent and its sign-in side effect.
enable_signup = false
enable_confirmations = true
template = "Your Bambini verification code is {{ .Code }}"
# Minimum gap between SMS sends to one number; matches the app-level
# resend cooldown (PHONE_LIMITS.send.userCooldownSeconds = 60).
max_frequency = "60s"

[auth.sms.test_otp]
# LOCAL / TEST ONLY. Once a provider is enabled locally, a number listed
# here never receives a real SMS and its code is the fixed value below,
# so the real start -> verify flow can be exercised with no real SMS.
# (Without an enabled provider the CLI disables phone login entirely, so
# this block is inert until then.) Phone is the Auth form: country code,
# no "+". 27820000001 is a South African mobile shape (passes
# src/server/phone/normalizePhone.ts) used purely as a fixture.
# NEVER apply this file to a hosted project (supabase config push) with
# this block present — a fixed OTP for a number is a verification
# backdoor there. See ENVIRONMENT.md.
27820000001 = "123456"

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.product-images]
# Private, not public: a public bucket serves objects from an endpoint
# that bypasses RLS entirely, which can't keep a draft listing's photos
# unlisted. Reads go through signed URLs instead — see
# 20260921090200_product_images_storage_policies.sql.
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.verification-documents]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "application/pdf"]
