project_id = "bambini"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
# Mirrors src/server/auth/validation.ts's checkPasswordStrength() as a
# second, independent backstop enforced by Supabase Auth itself — the
# app's own check remains authoritative and runs first, this is
# defense in depth. Verified against the installed Supabase CLI
# (2.118.0)'s own generated config template: both keys and this exact
# value for password_requirements are real, supported options, not
# invented. Does NOT reach the already-deployed production project —
# see ENVIRONMENT.md's Production Supabase Auth configuration checklist
# for the equivalent Dashboard setting that must be made manually there.
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
# Phase 5: local/dev now reflects intended production behaviour — email
# confirmation is required before account_verification-relevant state
# (auth.users.email_confirmed_at) can ever become true. signUp() (see
# src/server/auth/actions.ts) branches on whether a session actually
# came back, since a signup with confirmation pending returns no active
# session until the user clicks the confirmation link.
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.product-images]
# Private, not public: a public bucket serves objects from an endpoint
# that bypasses RLS entirely, which can't keep a draft listing's photos
# unlisted. Reads go through signed URLs instead — see
# 20260921090200_product_images_storage_policies.sql.
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.verification-documents]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "application/pdf"]
